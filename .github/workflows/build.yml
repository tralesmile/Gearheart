name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Build C#
        run: |
          dotnet build Gearheart.csproj -c Debug
          dotnet build Gearheart.csproj -c ExportRelease

      - name: Import project
        run: godot --headless --import || true

      - name: Smoke test (run scenes headless, fail on errors)
        run: |
          set +e
          fail=0
          run() {
            name="$1"; shift
            echo "=== $name"
            timeout 300 godot --headless --path . --fixed-fps 120 "$@" > smoke.log 2>&1
            grep -E "\[(drive|race|mining|autodrive|debug)\]" smoke.log | tail -60
            if grep -E "ERROR|Unhandled exception|SCRIPT ERROR|System\.[A-Za-z]*Exception" smoke.log; then
              echo "::error::Smoke test failed: $name"
              tail -60 smoke.log
              fail=1
            fi
          }
          run "garage"            res://scenes/garage.tscn --quit-after 300
          run "physics lab"       res://scenes/tests/physics_test.tscn --quit-after 600
          run "hill climb, starter car, 40 s" res://scenes/drive.tscn --quit-after 4800 -- --hillclimb --autodrive
          run "free drive, driller, 40 s"     res://scenes/drive.tscn --quit-after 4800 -- --freedrive --autodrive --design=driller
          exit $fail

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/Gearheart.exe

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/Gearheart.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: gearheart-windows
          path: build/windows

      - uses: actions/upload-artifact@v4
        with:
          name: gearheart-linux
          path: build/linux
