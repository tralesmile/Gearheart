name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.2

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Build C#
        run: |
          dotnet build Gearheart.csproj -c Debug
          dotnet build Gearheart.csproj -c ExportRelease

      - name: Import project
        run: godot --headless --import || true

      - name: Smoke test (run scenes headless, fail on errors)
        run: |
          set +e
          fail=0
          run() {
            name="$1"; shift
            echo "=== $name"
            timeout 300 godot --headless --path . --fixed-fps 120 "$@" > smoke.log 2>&1
            grep -E "\[(world|autoplay|drive|race|mining|autodrive|stunt|crash|stash|pickup|speed|trip|ice)\]" smoke.log | tail -60
            grep "\[deep\]" smoke.log | head -30
            grep "\[landing\]" smoke.log | head -30
            grep "\[kicker\]" smoke.log | head -24
            grep "\[engine\]" smoke.log | head -24
            grep -E "\[(launch|stall)\]" smoke.log | head -16
            grep "\[sprint\]" smoke.log | head -12
            grep "\[rock\]" smoke.log | head -30
            grep "\[flip\]" smoke.log | head -90
            grep "\[aircam\]" smoke.log | head -30
            grep "\[turbo\]" smoke.log | head -14
            grep "\[night\]" smoke.log | head -24
            grep "\[birds\]" smoke.log | head -14
            # "resources still in use at exit" is a shutdown notice about cached textures and sounds, not a fault.
            if grep -E "ERROR|Unhandled exception|SCRIPT ERROR|System\.[A-Za-z]*Exception" smoke.log | grep -v "still in use at exit" | grep .; then
              echo "::error::Smoke test failed: $name"
              tail -60 smoke.log
              fail=1
            fi
          }
          run "world: walk, mine, place, then drive 30 s" res://scenes/world.tscn --quit-after 4800 -- --fresh --autoplay --design=starter
          run "world: drill car tunnelling"            res://scenes/world.tscn --quit-after 4800 -- --fresh --autoplay --design=driller
          run "world: Crystal Drill car tunnelling (same route as the drill car)" res://scenes/world.tscn --quit-after 4800 -- --fresh --autoplay --design=crystal
          run "world: the Deep (on foot in a crystal cavern, dig out crystals)" res://scenes/world.tscn --quit-after 3600 -- --fresh --autoplay --deeptest --design=starter
          run "world: drive left to the Frozen North"  res://scenes/world.tscn --quit-after 4800 -- --fresh --autoplay --left --design=starter
          run "world: drive left to the Frozen North on Spiked Tyres" res://scenes/world.tscn --quit-after 4800 -- --fresh --autoplay --left --design=spiked
          run "world: V8 swap (engine sound and gearbox, 6 gears)" res://scenes/world.tscn --quit-after 2400 -- --fresh --autoplay --design=v8
          run "world: Scrap 4-Cylinder swap (4 gears)" res://scenes/world.tscn --quit-after 2400 -- --fresh --autoplay --design=scrap4
          run "world: launch control, perfect start (rides the limiter once, then lets go in the green), then a second 20 m sprint" res://scenes/world.tscn --quit-after 2700 -- --fresh --autoplay --launchtest --design=starter
          run "world: launch control, let go too early (bogged)" res://scenes/world.tscn --quit-after 900 -- --fresh --autoplay --launchearly --design=starter
          run "world: launch control, Scrap 4-Cylinder" res://scenes/world.tscn --quit-after 900 -- --fresh --autoplay --launchtest --design=scrap4
          run "world: rock it free (3-tile trench past the pad, the bot rocks E/Q when stuck)" res://scenes/world.tscn --quit-after 2700 -- --fresh --autoplay --rocktest --design=starter
          run "world: rock it free, 2-tile trench" res://scenes/world.tscn --quit-after 2700 -- --fresh --autoplay --rocktest --rockdepth=2 --design=starter
          run "world: rock it free, CONTROL (2-tile trench, no rocking, only backing up)" res://scenes/world.tscn --quit-after 2700 -- --fresh --autoplay --rocktest --rockdepth=2 --norock --design=starter
          run "world: rock it free, CONTROL (3-tile trench, no rocking)" res://scenes/world.tscn --quit-after 2700 -- --fresh --autoplay --rocktest --norock --design=starter
          run "world: Turbo pickup (starter + Turbocharger on the V6), same route as the starter" res://scenes/world.tscn --quit-after 4800 -- --fresh --autoplay --design=turbo
          run "world: launch control, Turbo pickup (the launch charge spools the turbo), then a second sprint" res://scenes/world.tscn --quit-after 2700 -- --fresh --autoplay --launchtest --design=turbo
          run "world: dusk into night (clock from 19:00 at 3x), starter car east" res://scenes/world.tscn --quit-after 4800 -- --fresh --autoplay --time=19 --clockrate=3 --design=starter
          run "world: night drive west (reversing lamp), from 22:00" res://scenes/world.tscn --quit-after 3600 -- --fresh --autoplay --left --time=22 --design=starter
          run "world: rocket booster car"             res://scenes/world.tscn --quit-after 4800 -- --fresh --autoplay --design=rocket
          run "world: flip tricks, rocket car (tries a backflip, then a frontflip, ... off every kicker)" res://scenes/world.tscn --quit-after 4800 -- --fresh --autoplay --fliptest --design=rocket
          run "world: flip tricks, starter car (no booster: are its jumps long enough?)" res://scenes/world.tscn --quit-after 3600 -- --fresh --autoplay --fliptest --design=starter
          run "world: crash test (15 m drop, then drive)" res://scenes/world.tscn --quit-after 2400 -- --fresh --autoplay --crashtest --design=starter
          run "world: buried stash test (dig up planted stashes)" res://scenes/world.tscn --quit-after 1800 -- --fresh --autoplay --stashtest --design=starter
          run "world: trip report (two out-and-back drives)" res://scenes/world.tscn --quit-after 7800 -- --fresh --autoplay --triptest --design=starter
          run "world: long-jump flags (one record to beat, the rest out of reach)" res://scenes/world.tscn --quit-after 4800 -- --fresh --autoplay --jumptest --design=starter
          run "world: ice strip, plain tyres"  res://scenes/world.tscn --quit-after 3600 -- --fresh --autoplay --icetest --design=starter
          run "world: ice strip, spiked tyres" res://scenes/world.tscn --quit-after 3600 -- --fresh --autoplay --icetest --design=spiked
          run "garage"            res://scenes/garage.tscn --quit-after 300
          run "physics lab"       res://scenes/tests/physics_test.tscn --quit-after 600
          run "hill climb, starter car, 40 s" res://scenes/drive.tscn --quit-after 4800 -- --hillclimb --autodrive --design=starter
          run "hill climb, Turbo pickup, 40 s" res://scenes/drive.tscn --quit-after 4800 -- --hillclimb --autodrive --design=turbo
          run "hill climb, rocket car, 40 s"  res://scenes/drive.tscn --quit-after 4800 -- --hillclimb --autodrive --design=rocket
          run "free drive, driller, 40 s"     res://scenes/drive.tscn --quit-after 4800 -- --freedrive --autodrive --design=driller
          # Same car, flat test track instead of the world: does the Scrap 4-Cylinder pickup stall there too?
          run "free drive, Scrap 4-Cylinder, 10 s" res://scenes/drive.tscn --quit-after 1200 -- --freedrive --autodrive --design=scrap4
          run "free drive, V8, 10 s"              res://scenes/drive.tscn --quit-after 1200 -- --freedrive --autodrive --design=v8
          exit $fail

      - name: Screenshots (software rendering, for review)
        continue-on-error: true
        run: |
          sudo apt-get update -qq > /dev/null 2>&1 || true
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null 2>&1 || true
          mkdir -p shots/night shots/nightleft shots/dawn shots/turbo shots/flip shots/rock shots/launch shots/world shots/left shots/drill shots/rocket shots/crash shots/stash shots/trip shots/garage shots/iceplain shots/icespiked shots/jump shots/deep shots/crystal keep
          # Keep Godot from importing (and exporting) the thousands of movie frames: they slowed every
          # later run, bloated the game builds and flooded the job log past the playtest lines.
          touch shots/.gdignore keep/.gdignore
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/world/f.png --quit-after 400 res://scenes/world.tscn -- --fresh --autoplay --design=starter > shots/world.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/left/f.png --quit-after 400 res://scenes/world.tscn -- --fresh --autoplay --left --design=starter > shots/left.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/drill/f.png --quit-after 400 res://scenes/world.tscn -- --fresh --autoplay --design=driller > shots/drill.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/rocket/f.png --quit-after 400 res://scenes/world.tscn -- --fresh --autoplay --design=rocket > shots/rocket.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/crash/f.png --quit-after 200 res://scenes/world.tscn -- --fresh --autoplay --crashtest --design=starter > shots/crash.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/stash/f.png --quit-after 110 res://scenes/world.tscn -- --fresh --autoplay --stashtest --design=starter > shots/stash.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/trip/f.png --quit-after 650 res://scenes/world.tscn -- --fresh --autoplay --triptest --design=starter > shots/trip.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/iceplain/f.png --quit-after 220 res://scenes/world.tscn -- --fresh --autoplay --icetest --design=starter > shots/iceplain.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/icespiked/f.png --quit-after 220 res://scenes/world.tscn -- --fresh --autoplay --icetest --design=spiked > shots/icespiked.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/jump/f.png --quit-after 400 res://scenes/world.tscn -- --fresh --autoplay --jumptest --design=starter > shots/jump.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/deep/f.png --quit-after 260 res://scenes/world.tscn -- --fresh --autoplay --deeptest --design=starter > shots/deep.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/crystal/f.png --quit-after 400 res://scenes/world.tscn -- --fresh --autoplay --design=crystal > shots/crystal.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/rock/f.png --quit-after 230 res://scenes/world.tscn -- --fresh --autoplay --rocktest --rockdepth=2 --design=starter > shots/rock.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/launch/f.png --quit-after 90 res://scenes/world.tscn -- --fresh --autoplay --launchtest --design=starter > shots/launch.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/flip/f.png --quit-after 400 res://scenes/world.tscn -- --fresh --autoplay --fliptest --design=rocket > shots/flip.log 2>&1 || true
          # Flip tricks: mid-flip (upside down), the first full turn, the landed flip call-out, a crashed flip.
          grep "\[flip\] bot: going" shots/flip.log | head -2 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            for d in 3 5; do
              f=$(printf "shots/flip/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/flip_mid_$((n + d)).png
            done
          done
          grep "\[flip\] turn 1" shots/flip.log | head -2 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            f=$(printf "shots/flip/f%08d.png" $((n + 1))); [ -f "$f" ] && cp "$f" keep/flip_turn_$((n + 1)).png
          done
          grep "\[flip\] LANDED" shots/flip.log | head -2 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            for d in 1 5; do
              f=$(printf "shots/flip/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/flip_landed_$((n + d)).png
            done
          done
          grep "\[flip\] crashed" shots/flip.log | head -1 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            f=$(printf "shots/flip/f%08d.png" $((n + 2))); [ -f "$f" ] && cp "$f" keep/flip_crashed_$((n + 2)).png
          done
          grep -E "\[flip\]" shots/flip.log | head -16
          # Air cam: a moment into each of the first big jumps (eased out, landing shadow), and the touchdown.
          for run in flip rocket jump; do
            grep "\[aircam\] big air" shots/$run.log | head -3 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              for d in 3 7; do
                f=$(printf "shots/$run/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/aircam_${run}_$((n + d)).png
              done
            done
            grep "\[aircam\] touchdown" shots/$run.log | head -2 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              f=$(printf "shots/$run/f%08d.png" $((n + 2))); [ -f "$f" ] && cp "$f" keep/aircam_${run}_down_$((n + 2)).png
            done
            grep "\[aircam\]" shots/$run.log | head -8
          done
          # Day and night: dusk into night on the meadow road (clock at 3x), a night drive west, and a dawn.
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/night/f.png --quit-after 400 res://scenes/world.tscn -- --fresh --autoplay --time=19 --clockrate=3 --design=starter > shots/night.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/nightleft/f.png --quit-after 300 res://scenes/world.tscn -- --fresh --autoplay --left --time=22 --design=starter > shots/nightleft.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/dawn/f.png --quit-after 160 res://scenes/world.tscn -- --fresh --autoplay --time=4.2 --clockrate=3 --design=starter > shots/dawn.log 2>&1 || true
          for i in 10 40 70 100 140 180 230 280 330 390; do
            f=$(printf "shots/night/f%08d.png" $i); [ -f "$f" ] && cp "$f" keep/night_$i.png
          done
          for i in 30 140 200 260; do
            f=$(printf "shots/nightleft/f%08d.png" $i); [ -f "$f" ] && cp "$f" keep/nightleft_$i.png
          done
          for i in 20 60 100 150; do
            f=$(printf "shots/dawn/f%08d.png" $i); [ -f "$f" ] && cp "$f" keep/dawn_$i.png
          done
          grep -E "\[night\]" shots/night.log shots/nightleft.log shots/dawn.log | head -40
          # Turbo: the car with its turbo on the bonnet at full boost (dashboard BOOST arc), and a blow-off puff.
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/turbo/f.png --quit-after 300 res://scenes/world.tscn -- --fresh --autoplay --launchtest --design=turbo > shots/turbo.log 2>&1 || true
          grep "\[turbo\] full boost" shots/turbo.log | head -2 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            for d in 1 4; do
              f=$(printf "shots/turbo/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/turbo_full_$((n + d)).png
            done
          done
          grep "\[turbo\] blow-off" shots/turbo.log | head -2 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            f=$(printf "shots/turbo/f%08d.png" $((n + 1))); [ -f "$f" ] && cp "$f" keep/turbo_blowoff_$((n + 1)).png
          done
          grep -E "\[(turbo|launch|sprint)\]" shots/turbo.log | head -12
          # Launch control: charging, the GO window just before letting go, and the PERFECT START a moment after.
          grep "\[launch\] Perfect start" shots/launch.log | head -1 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            for d in -6 -1 2 6; do
              f=$(printf "shots/launch/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/launch_$((n + d)).png
            done
          done
          grep -E "\[(launch|engine)\]" shots/launch.log | head -10
          # Rock it free: stuck in the trench (hint and call-out), mid-rock (third rock of a chain), and free.
          grep "\[rock\] stuck" shots/rock.log | head -1 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            f=$(printf "shots/rock/f%08d.png" $((n + 2))); [ -f "$f" ] && cp "$f" keep/rock_stuck_$((n + 2)).png
          done
          grep "\[rock\] rock chain=3" shots/rock.log | head -1 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            for d in 0 2; do
              f=$(printf "shots/rock/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/rock_chain_$((n + d)).png
            done
          done
          grep "\[rock\] free" shots/rock.log | head -1 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            for d in 1 6; do
              f=$(printf "shots/rock/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/rock_free_$((n + d)).png
            done
          done
          for i in 20 40; do
            f=$(printf "shots/rock/f%08d.png" $i); [ -f "$f" ] && cp "$f" keep/rock_$i.png
          done
          grep "\[rock\]" shots/rock.log | head -24
          # Gate sprint: the call-out with the time a moment after crossing 20 m.
          grep "\[sprint\] finish" shots/launch.log | head -1 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            for d in 1 6; do
              f=$(printf "shots/launch/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/sprint_$((n + d)).png
            done
          done
          grep "\[sprint\]" shots/launch.log | head -4
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/garage/f.png --quit-after 12 res://scenes/garage.tscn > shots/garage.log 2>&1 || true
          # Engine: the frame just after each of the first upshifts (gear box flash on the dashboard) and the first exhaust pop.
          grep "\[engine\] upshift" shots/world.log | head -3 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            f=$(printf "shots/world/f%08d.png" $((n + 1))); [ -f "$f" ] && cp "$f" keep/shift_world_$((n + 1)).png
          done
          grep "\[engine\] backfire" shots/world.log | head -2 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            f=$(printf "shots/world/f%08d.png" $((n + 1))); [ -f "$f" ] && cp "$f" keep/pop_world_$((n + 1)).png
          done
          grep "\[engine\]" shots/world.log | head -12
          # The Deep: the cavern the bot is placed in, the THE DEEP card, digging crystals, and the first crystal mined.
          for i in 6 12 30 60 120 200 250; do
            f=$(printf "shots/deep/f%08d.png" $i); [ -f "$f" ] && cp "$f" keep/deep_$i.png
          done
          grep "\[deep\] crystal mined" shots/deep.log | head -1 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            f=$(printf "shots/deep/f%08d.png" $((n + 2))); [ -f "$f" ] && cp "$f" keep/deep_crystal_$((n + 2)).png
          done
          grep "\[deep\]" shots/deep.log | head -20
          for i in 280 330 390; do
            f=$(printf "shots/crystal/f%08d.png" $i); [ -f "$f" ] && cp "$f" keep/crystaldrill_$i.png
          done
          for run in world left drill rocket; do
            for i in 25 98 130 180 230 280 330 390; do
              f=$(printf "shots/$run/f%08d.png" $i); [ -f "$f" ] && cp "$f" keep/${run}_$i.png
            done
          done
          f=$(ls shots/garage/*.png 2>/dev/null | tail -1); [ -n "$f" ] && cp "$f" keep/garage.png
          # Birds: the garage-roof sparrows flushed by the engine start, and the first flocks along the road
          # (sparrows, Wastes crows, snow buntings) just before, during and after they take off.
          for run in world left rocket; do
            (grep "\[birds\] scatter" shots/$run.log | head -4; grep "\[birds\] scatter: crows" shots/$run.log | head -1) | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              for d in -2 3 8; do
                f=$(printf "shots/$run/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/birds_${run}_$((n + d)).png
              done
            done
            grep "\[birds\]" shots/$run.log | head -10
          done
          # Crash frames: the frame of each of the first hits (from "[crash] ... frame=N") and the next two.
          for run in crash rocket; do
            grep "\[crash\] hit" shots/$run.log | head -4 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              for d in 0 1 2; do
                f=$(printf "shots/$run/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/crash_${run}_$((n + d)).png
              done
            done
          done
          # Pickup frames: a few frames before each of the first pickups (to see it lying there) and just after.
          for run in world left rocket; do
            grep "\[pickup\] \(fuel can\|scrap heap\)" shots/$run.log | head -3 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              for d in -6 1; do
                f=$(printf "shots/$run/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/pickup_${run}_$((n + d)).png
              done
            done
          done
          # Speed streaks: the frame where they first pass 0.6, and a moment later.
          for run in world left rocket; do
            grep "\[speed\] streaks" shots/$run.log | head -1 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              for d in 0 4; do
                f=$(printf "shots/$run/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/speed_${run}_$((n + d)).png
              done
            done
          done
          # Trip report cards: rows ticking in, the score counted up, and the card a few seconds later.
          grep "\[trip\] report" shots/trip.log | head -2 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
            for d in 8 30 60; do
              f=$(printf "shots/trip/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/trip_$((n + d)).png
            done
          done
          # Trip goals: the TRIP GOAL call-out leaving the gate, and the GOAL DONE moment.
          for run in trip world left rocket; do
            grep "\[trip\] start" shots/$run.log | head -2 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              f=$(printf "shots/$run/f%08d.png" $((n + 5))); [ -f "$f" ] && cp "$f" keep/goal_start_${run}_$((n + 5)).png
            done
            grep "\[trip\] goal done:" shots/$run.log | head -2 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              for d in 3 20; do
                f=$(printf "shots/$run/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/goal_done_${run}_$((n + d)).png
              done
            done
          done
          # Kickers: the first two take-offs from a kicker crest, in the air and coming down.
          for run in world left rocket trip; do
            grep "\[kicker\] take-off" shots/$run.log | head -2 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              for d in -4 2 6; do
                f=$(printf "shots/$run/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/kicker_${run}_$((n + d)).png
              done
            done
            grep "\[kicker\]" shots/$run.log | head -8
          done
          # Long jumps: the call-out after the first jumps off a kicker, and the record flags seen on the approach.
          for run in world left rocket trip jump; do
            grep "\[kicker\] long jump" shots/$run.log | head -2 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              for d in 2 8; do
                f=$(printf "shots/$run/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/longjump_${run}_$((n + d)).png
              done
            done
            grep "\[kicker\] approach" shots/$run.log | head -2 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              for d in 4 9; do
                f=$(printf "shots/$run/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/flag_${run}_$((n + d)).png
              done
            done
          done
          # Landing grades: the call-out just after the first perfect landing and the first botched one.
          for run in world left rocket trip; do
            grep "\[landing\] perfect" shots/$run.log | head -2 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              for d in 1 5; do
                f=$(printf "shots/$run/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/land_perfect_${run}_$((n + d)).png
              done
            done
            grep "\[landing\] flop" shots/$run.log | head -1 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              f=$(printf "shots/$run/f%08d.png" $((n + 3))); [ -f "$f" ] && cp "$f" keep/land_flop_${run}_$((n + 3)).png
            done
            grep "\[landing\]" shots/$run.log | head -12
          done
          # Ice strip: plain vs spiked tyres, from the moment the car rolls onto the ice.
          for run in iceplain icespiked; do
            grep "\[ice\] onto the ice" shots/$run.log | head -1 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              for d in 3 12 30 60 100; do
                f=$(printf "shots/$run/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/${run}_$((n + d)).png
              done
            done
            grep "\[ice\]" shots/$run.log | head -20
          done
          grep "\[trip\]" shots/trip.log | head -40
          grep "\[speed\]" shots/*.log | head -5
          grep "\[pickup\]" shots/world.log | head -8
          for i in 28 32 36 40 45 50 60 75 95; do
            f=$(printf "shots/stash/f%08d.png" $i); [ -f "$f" ] && cp "$f" keep/stash_$i.png
          done
          grep "\[stash\]" shots/stash.log | head -10
          for i in 8 15 30 60 120; do
            f=$(printf "shots/crash/f%08d.png" $i); [ -f "$f" ] && cp "$f" keep/crashrun_$i.png
          done
          grep "\[crash\]" shots/crash.log shots/rocket.log | head -20
          ls shots/world | head -3; ls keep; tail -5 shots/world.log

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: screenshots
          path: keep
          retention-days: 3

      - name: Publish screenshots to the "screenshots" branch
        continue-on-error: true
        run: |
          cd keep
          git init -q -b screenshots
          git config user.name "gearheart-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/Gearheart.exe

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/Gearheart.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: gearheart-windows
          path: build/windows
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: gearheart-linux
          path: build/linux
          retention-days: 5
