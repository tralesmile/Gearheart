name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.2

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Build C#
        run: |
          dotnet build Gearheart.csproj -c Debug
          dotnet build Gearheart.csproj -c ExportRelease

      - name: Import project
        run: godot --headless --import || true

      - name: Smoke test (run scenes headless, fail on errors)
        run: |
          set +e
          fail=0
          run() {
            name="$1"; shift
            echo "=== $name"
            timeout 300 godot --headless --path . --fixed-fps 120 "$@" > smoke.log 2>&1
            grep -E "\[(world|autoplay|drive|race|mining|autodrive|stunt|crash|stash|pickup|speed)\]" smoke.log | tail -60
            # "resources still in use at exit" is a shutdown notice about cached textures and sounds, not a fault.
            if grep -E "ERROR|Unhandled exception|SCRIPT ERROR|System\.[A-Za-z]*Exception" smoke.log | grep -v "still in use at exit" | grep .; then
              echo "::error::Smoke test failed: $name"
              tail -60 smoke.log
              fail=1
            fi
          }
          run "world: walk, mine, place, then drive 30 s" res://scenes/world.tscn --quit-after 4800 -- --fresh --autoplay --design=starter
          run "world: drill car tunnelling"            res://scenes/world.tscn --quit-after 4800 -- --fresh --autoplay --design=driller
          run "world: drive left to the Frozen North"  res://scenes/world.tscn --quit-after 4800 -- --fresh --autoplay --left --design=starter
          run "world: rocket booster car"             res://scenes/world.tscn --quit-after 4800 -- --fresh --autoplay --design=rocket
          run "world: crash test (15 m drop, then drive)" res://scenes/world.tscn --quit-after 2400 -- --fresh --autoplay --crashtest --design=starter
          run "world: buried stash test (dig up planted stashes)" res://scenes/world.tscn --quit-after 1800 -- --fresh --autoplay --stashtest --design=starter
          run "garage"            res://scenes/garage.tscn --quit-after 300
          run "physics lab"       res://scenes/tests/physics_test.tscn --quit-after 600
          run "hill climb, starter car, 40 s" res://scenes/drive.tscn --quit-after 4800 -- --hillclimb --autodrive --design=starter
          run "hill climb, rocket car, 40 s"  res://scenes/drive.tscn --quit-after 4800 -- --hillclimb --autodrive --design=rocket
          run "free drive, driller, 40 s"     res://scenes/drive.tscn --quit-after 4800 -- --freedrive --autodrive --design=driller
          exit $fail

      - name: Screenshots (software rendering, for review)
        continue-on-error: true
        run: |
          sudo apt-get update -qq > /dev/null 2>&1 || true
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null 2>&1 || true
          mkdir -p shots/world shots/left shots/drill shots/rocket shots/crash shots/stash shots/garage keep
          # Keep Godot from importing (and exporting) the thousands of movie frames: they slowed every
          # later run, bloated the game builds and flooded the job log past the playtest lines.
          touch shots/.gdignore keep/.gdignore
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/world/f.png --quit-after 400 res://scenes/world.tscn -- --fresh --autoplay --design=starter > shots/world.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/left/f.png --quit-after 400 res://scenes/world.tscn -- --fresh --autoplay --left --design=starter > shots/left.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/drill/f.png --quit-after 400 res://scenes/world.tscn -- --fresh --autoplay --design=driller > shots/drill.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/rocket/f.png --quit-after 400 res://scenes/world.tscn -- --fresh --autoplay --design=rocket > shots/rocket.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/crash/f.png --quit-after 200 res://scenes/world.tscn -- --fresh --autoplay --crashtest --design=starter > shots/crash.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/stash/f.png --quit-after 110 res://scenes/world.tscn -- --fresh --autoplay --stashtest --design=starter > shots/stash.log 2>&1 || true
          xvfb-run -a godot --path . --rendering-driver opengl3 --fixed-fps 10 --write-movie shots/garage/f.png --quit-after 12 res://scenes/garage.tscn > shots/garage.log 2>&1 || true
          for run in world left drill rocket; do
            for i in 25 98 130 180 230 280 330 390; do
              f=$(printf "shots/$run/f%08d.png" $i); [ -f "$f" ] && cp "$f" keep/${run}_$i.png
            done
          done
          f=$(ls shots/garage/*.png 2>/dev/null | tail -1); [ -n "$f" ] && cp "$f" keep/garage.png
          # Crash frames: the frame of each of the first hits (from "[crash] ... frame=N") and the next two.
          for run in crash rocket; do
            grep "\[crash\] hit" shots/$run.log | head -4 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              for d in 0 1 2; do
                f=$(printf "shots/$run/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/crash_${run}_$((n + d)).png
              done
            done
          done
          # Pickup frames: a few frames before each of the first pickups (to see it lying there) and just after.
          for run in world left rocket; do
            grep "\[pickup\] \(fuel can\|scrap heap\)" shots/$run.log | head -3 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              for d in -6 1; do
                f=$(printf "shots/$run/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/pickup_${run}_$((n + d)).png
              done
            done
          done
          # Speed streaks: the frame where they first pass 0.6, and a moment later.
          for run in world left rocket; do
            grep "\[speed\] streaks" shots/$run.log | head -1 | sed -E 's/.*frame=([0-9]+).*/\1/' | while read n; do
              for d in 0 4; do
                f=$(printf "shots/$run/f%08d.png" $((n + d))); [ -f "$f" ] && cp "$f" keep/speed_${run}_$((n + d)).png
              done
            done
          done
          grep "\[speed\]" shots/*.log | head -5
          grep "\[pickup\]" shots/world.log | head -8
          for i in 28 32 36 40 45 50 60 75 95; do
            f=$(printf "shots/stash/f%08d.png" $i); [ -f "$f" ] && cp "$f" keep/stash_$i.png
          done
          grep "\[stash\]" shots/stash.log | head -10
          for i in 8 15 30 60 120; do
            f=$(printf "shots/crash/f%08d.png" $i); [ -f "$f" ] && cp "$f" keep/crashrun_$i.png
          done
          grep "\[crash\]" shots/crash.log shots/rocket.log | head -20
          ls shots/world | head -3; ls keep; tail -5 shots/world.log

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: screenshots
          path: keep
          retention-days: 3

      - name: Publish screenshots to the "screenshots" branch
        continue-on-error: true
        run: |
          cd keep
          git init -q -b screenshots
          git config user.name "gearheart-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/Gearheart.exe

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/Gearheart.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: gearheart-windows
          path: build/windows
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: gearheart-linux
          path: build/linux
          retention-days: 5
